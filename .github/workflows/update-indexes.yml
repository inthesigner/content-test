
name: Update JSON indexes

on:
  push:
    paths:
      - 'talks/**/*.md'
      - 'projects/**/*.md'
      - 'generate_indexes.py'
      - '.github/workflows/update-indexes.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate indexes
        run: python generate_indexes.py

      - name: Commit JSON indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add talks.json projects.json
          git diff --cached --quiet || git commit -m "Update JSON indexes"
          git push
